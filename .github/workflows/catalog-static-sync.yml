name: Catalog Static Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static read models
        env:
          KITEPROP_API_USER: ${{ secrets.KITEPROP_API_USER }}
          KITEPROP_API_PASSWORD: ${{ secrets.KITEPROP_API_PASSWORD }}
          KITEPROP_NETWORK_ID: ${{ secrets.KITEPROP_NETWORK_ID }}
          KITEPROP_NETWORK_TOKEN: ${{ secrets.KITEPROP_NETWORK_TOKEN }}
          KITEPROP_PROPERTIES_SOURCE: json
          REDALIA_PARTNER_DIRECTORY_SOURCE: network
        run: pnpm generate:static-read-models

      - name: Commit and push snapshot changes
        run: |
          if git diff --quiet -- public/read-models; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/read-models
          git commit -m "chore(read-models): refresh static snapshots"
          git push origin HEAD:main
